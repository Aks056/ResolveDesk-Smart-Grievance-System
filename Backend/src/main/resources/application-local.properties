# ============================================================
# application-local.properties

# ============================================================

# ============================================================
# SERVER CONFIGURATION
# ============================================================
spring.application.name=Smart Grievance Redressal System
spring.profiles.active=local
server.port=8081
server.servlet.context-path=/
server.servlet.session.timeout=30m
server.compression.enabled=true
server.compression.min-response-size=1024

# ============================================================
# DATABASE CONFIGURATION
# ============================================================
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/smart_grievance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=CHANGE_ME_DB_USERNAME
spring.datasource.password=CHANGE_ME_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# ============================================================
# JWT CONFIGURATION
# ============================================================
# Generate a strong secret key: openssl rand -base64 64
jwt.secret.key=CHANGE_ME_BASE64_ENCODED_SECRET_KEY_MINIMUM_64_CHARACTERS_LONG
jwt.expiration.time=86400000
jwt.refresh.expiration.time=604800000

# ============================================================
# EMAIL CONFIGURATION
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=CHANGE_ME_YOUR_EMAIL@gmail.com
spring.mail.password=CHANGE_ME_YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=CHANGE_ME_SENDER_EMAIL@yourdomain.com
app.mail.fromName=Smart Grievance System

# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/
app.allowed.file.extensions=pdf,doc,docx,jpg,jpeg,png,txt
app.upload.max-size-bytes=5242880

# ============================================================
# FRONTEND CONFIGURATION (DECOUPLED)
# ============================================================
spring.thymeleaf.enabled=false

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
logging.level.root=INFO
logging.level.com.ayush.grievance=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# ============================================================
# ACTUATOR CONFIGURATION
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ============================================================
# JACKSON CONFIGURATION
# ============================================================
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ============================================================
# API DOCUMENTATION (SPRINGDOC-OPENAPI)
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
