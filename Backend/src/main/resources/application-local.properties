# ============================================================
# application-local.properties.example
#
# SAFE TO COMMIT — no real credentials here.
#
# HOW TO USE:
#   1. Copy this file to application-local.properties  (same directory)
#   2. Fill in your real values below
#   3. Set spring.profiles.active=local (or dev) when starting the app
#      so Spring Boot loads this file on top of application.properties
#
# application-local.properties is already listed in .gitignore,
# so your real credentials will never be accidentally committed.
# ============================================================

# ── Database ─────────────────────────────────────────────────

# ── JWT Secret (minimum 64 characters, keep it random) ───────
JWT_SECRET_KEY=replace_with_a_random_64plus_char_string_generated_by_openssl

# ── Demo seed account passwords (dev profile only) ───────────
# These are used by DataInitializer when spring.profiles.active=dev
DEMO_ADMIN_PASSWORD=admin1234
DEMO_OFFICER_PASSWORD=officer1234

# ── Email (optional for local dev — mock mode is active by default) ──
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-gmail-app-password

